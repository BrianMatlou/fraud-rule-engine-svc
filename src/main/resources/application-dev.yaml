spring:
  application:
    name: transaction-fraud-check

  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_fraud
    username: fraud_user
    password: fraud_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: transaction-fraud-engine
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "za.co.capitecbank.dto"
        spring.json.value.default.type: "za.co.capitecbank.dto.TransactionEventDto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/capitec

fraud-check:
  high-score-threshold: 100
  medium-score-threshold: 50
  kafka:
    topic: transaction-events
    dead-letter-topic: transaction-events-dlt

  rate-limit:
    fraud-check:
      capacity: 50
      refill-tokens: 100
      refill-period-seconds: 60
    rules:
      capacity: 50
      refill-tokens: 50
      refill-period-seconds: 60

logging:
  level:
    org.apache: OFF
